<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.P.A. Access Admin</title><style>body{margin:0;background:#05070a;color:#e9f0f6;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:28px}h1{letter-spacing:.12em}input,button{background:#0b0f14;color:#fff;border:1px solid #27323f;padding:10px}button{cursor:pointer}.login{display:flex;gap:8px}.req{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;align-items:center;border:1px solid #1a222c;background:#0b0f14;padding:12px;margin-top:8px}.muted{color:#8794a2;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.approve{border-color:#26d980}.deny{border-color:#ff4d67}@media(max-width:650px){.req{grid-template-columns:1fr}.login{flex-direction:column}}</style></head><body><div class="wrap"><h1>A.P.A. ACCESS ADMIN</h1><p class="muted">Approve, deny or revoke dashboard access requests.</p><div class="login"><input id="key" type="password" placeholder="Admin key" style="flex:1"><button id="load">LOAD REQUESTS</button></div><p id="msg" class="muted"></p><div id="rows"></div></div><script>const API='https://zuemztvanxdregfcppoa.supabase.co/functions/v1/apa-access',$=x=>document.getElementById(x);async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('key').value},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await call({action:'admin_list'});$('msg').textContent=d.requests.length+' request(s)';$('rows').innerHTML=d.requests.map(x=>'<div class="req"><div><b>'+esc(x.username)+'</b><div class="muted">'+new Date(x.requested_at).toLocaleString()+'</div></div><b>'+esc(x.status.toUpperCase())+'</b><div class="actions"><button class="approve" onclick="review('+x.id+',\'approved\')">APPROVE</button><button class="deny" onclick="review('+x.id+',\'denied\')">DENY</button><button onclick="review('+x.id+',\'revoked\')">REVOKE</button></div></div>').join('')||'<p class="muted">No requests yet.</p>'}catch(e){$('msg').textContent=e.message}}async function review(id,status){try{await call({action:'admin_review',id,status});await load()}catch(e){$('msg').textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('load').onclick=load;</script></body></html>
